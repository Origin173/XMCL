name: Nightly Build

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  Check-and-Prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check-changes.outputs.should_build }}
      nightly_version: ${{ steps.version.outputs.nightly_version }}
      nightly_app_version: ${{ steps.version.outputs.nightly_app_version }}
      commit_hash: ${{ steps.version.outputs.commit_hash }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper comparison

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changes and prepare nightly branch
        id: check-changes
        run: |
          echo "Checking for changes between main and nightly..."
          
          # First, delete any existing nightly tag to avoid conflicts
          if git ls-remote --tags origin | grep -q "refs/tags/nightly$"; then
            echo "Deleting existing remote nightly tag to avoid conflicts"
            git push origin :refs/tags/nightly
          fi
          
          # Get the latest commit hash from main
          MAIN_COMMIT=$(git rev-parse origin/main)
          echo "Latest main commit: $MAIN_COMMIT"
          
          # Check if nightly branch exists
          if git show-ref --verify --quiet refs/remotes/origin/nightly; then
            echo "Nightly branch exists"
            NIGHTLY_COMMIT=$(git rev-parse origin/nightly)
            echo "Latest nightly commit: $NIGHTLY_COMMIT"
            
            if [ "$MAIN_COMMIT" = "$NIGHTLY_COMMIT" ]; then
              echo "No changes detected between main and nightly"
              if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
                echo "Force build requested, proceeding anyway"
                echo "should_build=true" >> $GITHUB_OUTPUT
              else
                echo "should_build=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            else
              echo "Changes detected, nightly build needed"
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Nightly branch does not exist, creating it"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          
          # Create or update nightly branch to match main
          echo "Creating/updating nightly branch..."
          git checkout -B nightly origin/main
          
          # Push the branch explicitly using full ref path
          echo "Pushing nightly branch..."
          git push origin refs/heads/nightly:refs/heads/nightly --force
          
          echo "Nightly branch updated successfully"

      - name: Setup Node.js for version bump
        if: steps.check-changes.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Generate nightly version
        id: version
        if: steps.check-changes.outputs.should_build == 'true'
        run: |
          # Get base version from main branch's package.json (nightly branch now equals main)
          BASE_VERSION=$(cat package.json | jq -r '.version' | sed 's/-nightly-.*//')
          NIGHTLY_DATE=$(date -u +"%y%m%d")
          NIGHTLY_APP_VERSION="${BASE_VERSION}-nightly-${NIGHTLY_DATE}"
          
          # YYYYMMDD for artifact naming
          NIGHTLY_YYYYMMDD=$(date -u +"%Y%m%d")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          echo "Base version: $BASE_VERSION"
          echo "Nightly app version: $NIGHTLY_APP_VERSION"
          echo "Artifact date: $NIGHTLY_YYYYMMDD"
          echo "Commit hash: $COMMIT_HASH"
          
          echo "nightly_app_version=$NIGHTLY_APP_VERSION" >> $GITHUB_OUTPUT
          echo "nightly_version=$NIGHTLY_YYYYMMDD" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Bump version to nightly format
        if: steps.check-changes.outputs.should_build == 'true'
        run: |
          NIGHTLY_APP_VERSION="${{ steps.version.outputs.nightly_app_version }}"
          echo "Bumping version to ${NIGHTLY_APP_VERSION}..."
          npm run version bump "${NIGHTLY_APP_VERSION}"
          
          # Commit the version change to nightly branch
          git add .
          git commit -m "bump: version to ${NIGHTLY_APP_VERSION} for nightly build" || echo "No changes to commit"
          
          # Push the updated nightly branch with version bump
          git push origin refs/heads/nightly:refs/heads/nightly
          
          echo "Version bumped to ${NIGHTLY_APP_VERSION} and committed"

      - name: Create and push nightly tag
        if: steps.check-changes.outputs.should_build == 'true'
        run: |
          echo "Creating nightly tag on nightly branch"
          git checkout nightly
          
          # Delete any local nightly tag if it exists
          if git tag -l | grep -q "^nightly$"; then
            echo "Deleting existing local nightly tag"
            git tag -d nightly
          fi
          
          # Create new nightly tag
          git tag nightly
          
          # Push the tag explicitly using full ref path
          echo "Pushing nightly tag..."
          git push origin refs/tags/nightly:refs/tags/nightly
          
          echo "Nightly tag created and pushed successfully"

  Build-Nightly:
    needs: [Check-and-Prepare]
    if: needs.Check-and-Prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: "nightly_${{ needs.Check-and-Prepare.outputs.nightly_version }}"
      upload_artifacts: true
      branch: "nightly"
    secrets:
      XMCL_CURSEFORGE_API_KEY: ${{ secrets.XMCL_CURSEFORGE_API_KEY }}
      XMCL_OPENLIST_BASE_URL: ${{ secrets.XMCL_OPENLIST_BASE_URL }}
      NEXT_PUBLIC_OPENLIST_BASE_URL: ${{ secrets.NEXT_PUBLIC_OPENLIST_BASE_URL }}


  Create-Nightly-Release:
    needs: [Check-and-Prepare, Build-Nightly]
    if: always() && needs.Check-and-Prepare.outputs.should_build == 'true' && needs.Build-Nightly.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete existing nightly release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if nightly release exists and delete it
          if gh release view nightly >/dev/null 2>&1; then
            echo "Deleting existing nightly release"
            gh release delete nightly --yes
          else
            echo "No existing nightly release found"
          fi

      - name: Create nightly pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.Check-and-Prepare.outputs.nightly_version }}
          COMMIT_HASH: ${{ needs.Check-and-Prepare.outputs.commit_hash }}
        run: |
          # Create release notes
          cat > release_notes.md << 'EOF'
          
          > [!WARNING]
          > **This is a nightly build for developers and testers only!**
          
          Regular users should download the latest stable release instead of this nightly build.
          
          ### ⚠️ Important Notes:
          - This build may contain unstable features or bugs
          - Not recommended for production use
          - No support provided for nightly builds
          - Features may change or be removed without notice

          EOF
          
          echo "Creating nightly pre-release..."
          ls -la ./artifacts/*/*
          
          # Create the pre-release with nightly tag
          gh release create "nightly" \
            --title "XMCL Nightly (${{ env.NIGHTLY_VERSION }})" \
            --notes-file release_notes.md \
            --prerelease \
            --target nightly \
            ./artifacts/*/*
          
          echo "Nightly release created successfully!"

      - name: Cleanup old nightly releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for old nightly releases to cleanup..."
          
          # Get all releases, filter for old nightly ones (keeping only the latest)
          # This helps prevent the releases page from getting cluttered
          gh release list --limit 50 --json tagName,createdAt,isPrerelease | \
          jq -r '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName' | \
          head -n +5 | \
          while read tag; do
            if [ ! -z "$tag" ] && [ "$tag" != "nightly" ]; then
              echo "Deleting old nightly release: $tag"
              gh release delete "$tag" --yes || echo "Failed to delete $tag, continuing..."
            fi
          done
          
          echo "Cleanup completed" 

      - name: Push nightly branch and tag to Gitee
        if: ${{ vars.GITEE_NAMESPACE != '' }}
        env:
          GITEE_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GITEE_PRIVATE_KEY" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitee_key -o StrictHostKeyChecking=yes"

          GITEE_URL="git@gitee.com:${{ vars.GITEE_NAMESPACE }}/XMCL.git"
          git remote add gitee "$GITEE_URL" 2>/dev/null || git remote set-url gitee "$GITEE_URL"

          # Force push nightly branch
          git push gitee HEAD:refs/heads/nightly --force
          echo "Pushed nightly branch to Gitee"

          # Force push nightly tag (delete old one first to avoid conflict)
          git push gitee :refs/tags/nightly 2>/dev/null || true
          git push gitee refs/tags/nightly:refs/tags/nightly
          echo "Pushed nightly tag to Gitee"

      - name: Publish Nightly Release to Gitee
        if: ${{ vars.GITEE_NAMESPACE != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          NIGHTLY_VERSION: ${{ needs.Check-and-Prepare.outputs.nightly_version }}
        run: |
          OWNER="${{ vars.GITEE_NAMESPACE }}"
          REPO="XMCL"
          RELEASE_TITLE="XMCL Nightly (${{ env.NIGHTLY_VERSION }})"

          # Delete existing nightly release on Gitee if it exists
          EXISTING_ID=$(curl -sf \
            "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/tags/nightly?access_token=${GITEE_TOKEN}" \
            | jq -r '.id // empty' 2>/dev/null || true)
          if [ -n "$EXISTING_ID" ]; then
            curl -sf -X DELETE \
              "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${EXISTING_ID}?access_token=${GITEE_TOKEN}" \
              || echo "Warning: failed to delete existing Gitee nightly release"
            echo "Deleted existing Gitee nightly release (id: $EXISTING_ID)"
          fi

          # Create new nightly release on Gitee
          BODY=$(python3 -c 'import sys, json; print(json.dumps(open("release_notes.md").read()))')
          RESPONSE=$(curl -sf -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"nightly\",\"name\":\"${RELEASE_TITLE}\",\"body\":${BODY},\"prerelease\":true,\"target_commitish\":\"nightly\"}")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create Gitee nightly release. Response: $RESPONSE"
            exit 1
          fi
          echo "Created Gitee nightly release (id: $RELEASE_ID)"

          # Upload all artifacts with retry
          echo "Uploading artifacts..."
          for f in ./artifacts/*/*; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            echo "  Uploading: $FNAME"
            SUCCESS=false
            for attempt in 1 2 3; do
              if curl -sf -X POST \
                "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${f};filename=${FNAME}"; then
                echo "  ✓ $FNAME uploaded"
                SUCCESS=true
                break
              fi
              echo "  Attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            if [ "$SUCCESS" = "false" ]; then
              echo "  ✗ Failed to upload $FNAME after 3 attempts"
            fi
          done

          echo "Gitee nightly release published!"
