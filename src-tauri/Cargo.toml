[package]
name = "xmcl"
version = "0.2.0-nightly-260906"
description = "A Minecraft launcher from CAUCraft"
authors = ["CAUCraft Team"]
license = "GNU General Public License v3.0 (with additional terms)"
repository = "https://github.com/Origin173/XMCL"
edition = "2021"
rust-version = "1.80.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }
dotenvy = "0.15.7"

[profile.release]
opt-level = 3   # as default
strip = true
lto = false
panic = "abort"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.8.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.4.2"
tauri-plugin-fs = "=2.4.4"
tauri-plugin-log = "=2.7.1"
structstruck = "0.4.1"
tauri-plugin-http = { version = "=2.5.4", features = ["json", "stream"] }
tauri-plugin-os = "=2.3.2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["compat"] }
systemstat = "0.2.3"
partial_derive = { path = "./libs/partial_derive" }
uuid = { version = "1.11.0", features = [
    "v4",
    "v5",
    "fast-rng",
    "macro-diagnostics",
] }
tauri-plugin-process = "=2.3.1"
tauri-plugin-opener = "=2.5.2"
base64 = "0.22.1"
image = { version = "0.25.5", features = ["serde"] }
rand = "0.9.0"
zip = "2.3"
quartz_nbt = { version = "0.2.9", features = ["serde"] }
regex = "1.11"
toml = "0.8"
lazy_static = "1.5"
once_cell = "1.20"
jsonwebtoken = "9.3.1"
java-properties = "2.0.0"
sha1 = "0.10.1"
sha2 = "0.10.8"
md5 = "0.7.0"
hex = "0.4.3"
url = "2.5.4"
urlencoding = "2.1.3"
shlex = "1.3.0"
glob = "0.3.2"
pin-project = "1.1.8"
futures = "0.3.31"
strum = "0.27.1"
strum_macros = "0.27.1"
smart-default = "0.7.1"
tauri-plugin-clipboard-manager = "=2.3.2"
serde_with = "3.12.0"
chrono = "0.4.40"
sanitize-filename = "0.6.0"
cafebabe = "0.8.1"
tauri-plugin-deep-link = "=2.4.5"
flume = { version = "0.11.1", features = ["async", "select"] }
tauri-utils = "=2.8.1"
font-loader = "0.11.0"
async-speed-limit = "0.4.2"
reqwest = { version = "0.12", features = ["json"] }
reqwest-middleware = "0.4.2"
reqwest-retry = "0.7.0"
murmur2 = "0.1"
csv = "1.3"
semver = "1"
sysinfo = "0.36.0"
config = "0.15.18"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[target."cfg(windows)".dependencies]
winreg = "0.55.0"
winapi = { version = "0.3", features = ["processthreadsapi", "winnt", "handleapi", "winuser", "windef"] }

[target."cfg(target_os = \"macos\")".dependencies]
plist = "1"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.3", features = ["deep-link"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "=2.4.1"
